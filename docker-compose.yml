services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crm-backend
    ports:
      - "5001:5001"
    volumes:
      # Removed crm_db_data volume to prevent overwriting the config directory 
      # which contains the Firebase serviceAccountKey.json required for Firebase Data Connect.
      - crm_uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5001
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crm-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  crm_uploads:
